# Portainer-Stack „immoverwaltung“
#
# Portainer -> Stacks -> Add stack
#   Variante A „Repository“: URL dieses Repos, Reference leer lassen (= Standard-Branch),
#              Compose path: portainer/docker-compose.yml
#   Variante B „Web editor“: Inhalt dieser Datei einfügen
# Unter „Environment variables“ die Werte eintragen – einzeln oder per
# „Load variables from .env file“ mit portainer/stack.env.example als Vorlage.
# Portainer setzt sie hier über ${VARIABLE} ein; nicht gesetzte Werte nutzen den Standard.

services:
  immoverwaltung:
    image: ${IMAGE:-ghcr.io/itsh-neumeier/immoverwaltung}:${IMAGE_TAG:-latest}
    container_name: immoverwaltung
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/abrechnung.db
      TZ: ${TZ:-Europe/Berlin}
      # Home Assistant
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      # Erster Verwalter beim ersten Start (danach Benutzer im Webinterface verwalten)
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # E-Mail-Versand (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Rechnungseingang (IMAP, nur lesend)
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_SENDER: ${IMAP_SENDER:-awattar.de}
      IMAP_INTERVAL_MIN: ${IMAP_INTERVAL_MIN:-60}
      IMAP_SINCE_DAYS: ${IMAP_SINCE_DAYS:-40}
      # VRM (Victron-Cloud, optional)
      VRM_TOKEN: ${VRM_TOKEN:-}
      # WhatsApp Business Cloud API (Meta, optional)
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Volume-Name bleibt „stromabrechnung-data“ – so bleiben alle bisherigen Daten erhalten
      - stromabrechnung-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  stromabrechnung-data:
    name: stromabrechnung-data
