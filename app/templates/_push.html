<div class="card" id="push-card">
  <h2 style="margin-top:0">🔔 Benachrichtigungen</h2>
  <p class="muted" style="margin-top:0">{{ push_text or "Benachrichtigung auf diesem Gerät, sobald etwas Neues da ist." }}</p>
  <p id="push-status" class="muted">Prüfe …</p>
  <button type="button" id="push-on" hidden>Auf diesem Gerät aktivieren</button>
  <button type="button" id="push-test" class="sec" hidden>Test senden</button>
  <button type="button" id="push-off" class="sec" hidden>Deaktivieren</button>
</div>
