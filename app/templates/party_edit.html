{% extends "base.html" %}
{% block content %}
<h1>{{ "Neue Partei" if pid == 0 else p.name }}</h1>
<form method="post" class="card">
  <div class="grid">
    <div><label>Name / Wohneinheit</label><input type="text" name="name" value="{{ p.name }}" required placeholder="Familie Muster"></div>
    <div><label>Wohneinheiten-ID</label><input type="text" name="unit_id" value="{{ p.unit_id or '' }}" placeholder="WE-001"></div>
    <div><label>Lage (intern)</label><input type="text" name="unit" value="{{ p.unit or '' }}" placeholder="EG links"></div>
    <div><label>Sortierung</label><input type="number" name="sort" value="{{ p.sort or 0 }}"></div>
  </div>
  <label>E-Mail für den Versand (mehrere mit Komma trennen)</label>
  <input type="text" name="email" value="{{ p.email or '' }}" placeholder="familie@example.de">
  <label>Anschrift (optional, intern)</label><textarea name="address">{{ p.address or '' }}</textarea>
  <label>Shelly-Energie-Entitäten (eine pro Zeile, werden addiert)</label>
  <textarea name="meters" data-entity="multi" placeholder="sensor.shelly_wohnung_eg_energy">{{ (p.meters or [])|join("\n") }}</textarea>
  <div class="check"><input type="checkbox" name="is_owner" id="o" {% if p.is_owner %}checked{% endif %}><label for="o" style="margin:0">Eigentümer / Hauptpartei – bekommt den Restverbrauch</label></div>
  <div class="check"><input type="checkbox" name="active" id="a" {% if p.active %}checked{% endif %}><label for="a" style="margin:0">aktiv (wird abgerechnet)</label></div>
  <button>Speichern</button>
  {% if pid %}<button class="danger" name="delete" value="1" onclick="return confirm('Partei löschen?')">Löschen</button>{% endif %}
</form>
{% endblock %}
